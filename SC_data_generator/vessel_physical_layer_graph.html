<!doctype html>
<html lang="en">
<head>

<body>

  </div>
  <script>

    const data = { nodes, edges };
    const options = {
      autoResize: true,
      interaction: {
        hover: true,
        tooltipDelay: 100,
        navigationButtons: true,
        keyboard: true

      physics: {
